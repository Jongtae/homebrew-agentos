name: verify renamed AgentOS source

on:
  pull_request:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify v1.1.0 archive checksum after repository rename
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Jongtae/agentos/archive/refs/tags/v1.1.0.tar.gz"
          curl -L --fail --retry 3 -o /tmp/agentos-v1.1.0.tar.gz "$url"
          actual="$(sha256sum /tmp/agentos-v1.1.0.tar.gz | awk '{print $1}')"
          echo "RENAMED_ARCHIVE_SHA256=$actual"
          expected="3a5303e9a05890eb1c263d856fd1790ac870319d2c40c5ee01a39a1ecaf4a322"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=Archive checksum mismatch::expected=$expected actual=$actual"
            exit 1
          fi
