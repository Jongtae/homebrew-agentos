name: verify renamed AgentOS source

on:
  pull_request:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify v1.1.1 archive checksum after repository rename
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Jongtae/agentos/archive/refs/tags/v1.1.1.tar.gz"
          curl -L --fail --retry 3 -o /tmp/agentos-v1.1.1.tar.gz "$url"
          actual="$(sha256sum /tmp/agentos-v1.1.1.tar.gz | awk '{print $1}')"
          echo "RENAMED_ARCHIVE_SHA256=$actual"
          expected="fbd95903819ecaff4ac1f0d5bfa0e4131008657edae03465014cda8325c25510"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=Archive checksum mismatch::expected=$expected actual=$actual"
            exit 1
          fi

  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and test Formula from renamed source
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap-new jongtae/agentos
          tap_repo="$(brew --repository jongtae/agentos)"
          cp Formula/agentos.rb "$tap_repo/Formula/agentos.rb"
          brew install jongtae/agentos/agentos
          agentos --help >/tmp/agentos-help.txt
          grep -qi "personal agent" /tmp/agentos-help.txt
          brew test jongtae/agentos/agentos
